name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          echo "Detected Java Major Version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version must be 17 or newer."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created."
            exit 1
          fi
          echo "Debug keystore confirmed at ./debug.keystore"

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK not found at $EXPECTED_APK"
            echo "Searching inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi
          echo "Successfully verified $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$TEMP_DIR"
          
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "${REPO_RAW##*/}" | sed 's/[^a-zA-Z0-9._-]/_/g')
          RUN_NUM="${{ github.run_number }}"
          
          ASSET_NAME="${REPO_NAME}-debug-build-${RUN_NUM}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"
          
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi
          
          echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Asset path $ASSET_PATH is invalid or empty."
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          - GitHub Actions Run Number: ${{ github.run_number }}
          - GitHub Actions Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}
          - Purpose: Intended for testing.
          - Notice: The APK is not a Play Store production release. The APK is signed only with a temporary debug keystore.
          EOF
          )
          
          gh release create "$TAG_NAME" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest \
            "$ASSET_PATH"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "Release published successfully!"
            gh release view "$TAG_NAME"
            
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q ".url")
            
            echo "### 🚀 Debug APK Build Successful!" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK was built and published to GitHub Releases." >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Release URL:** [Download Release APK]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Asset:** \`${{ steps.prep_asset.outputs.asset_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "You can download the APK directly onto your phone from the release Assets section." >> $GITHUB_STEP_SUMMARY
            echo "The GitHub Actions artifact **app-debug-apk** is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "Warning: Release publishing encountered an error or was skipped."
            echo "### ⚠️ Debug APK Built - Artifact Available" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK build and verification succeeded." >> $GITHUB_STEP_SUMMARY
            echo "The primary GitHub Actions artifact **app-debug-apk** is available for download on the workflow run summary page." >> $GITHUB_STEP_SUMMARY
            echo "Note: Release publishing step did not complete, but your APK artifact was safely saved." >> $GITHUB_STEP_SUMMARY
          fi
